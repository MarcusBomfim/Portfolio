    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        const selectedTheme = savedTheme || preferredTheme
        document.documentElement.dataset.theme = selectedTheme
        document.documentElement.style.colorScheme = selectedTheme

        const savedLanguage = localStorage.getItem('portfolio-language')
        const selectedLanguage =
          savedLanguage === 'pt' || savedLanguage === 'en'
            ? savedLanguage
            : navigator.language.toLowerCase().startsWith('pt')
              ? 'pt'
              : 'en'
        document.documentElement.lang = selectedLanguage === 'pt' ? 'pt-BR' : 'en'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
